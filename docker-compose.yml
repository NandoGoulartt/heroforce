services:
  postgres:
    image: postgres:16
    container_name: heroforce_postgres
    restart: always
    environment:
      POSTGRES_DB: heroforce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: heroforce_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - '3000:3000'

volumes:
  postgres_data: